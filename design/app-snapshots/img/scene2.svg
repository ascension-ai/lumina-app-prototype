y="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">   judging them.</text><text x="900" y="503.4" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#059669" text-anchor="start">3. Format the findings as</text><text x="900" y="518.0" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">   structured JSON for the feed.</text><text x="900" y="532.5999999999999" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start"></text><text x="900" y="547.2" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#7C3AED" text-anchor="start">## Output Format</text><text x="900" y="561.8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">{&quot;type&quot;: &quot;meetings&quot;,</text><text x="900" y="576.4" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start"> &quot;data&quot;: { &quot;meetings&quot;: [...] }}</text><text x="900" y="591.0" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start"></text><text x="900" y="605.5999999999999" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#7C3AED" text-anchor="start">## Rules</text><text x="900" y="620.2" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">- Only report data actually</text><text x="900" y="634.8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">  retrieved from tools.</text><text x="900" y="649.4" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">- Apply the lookback date.</text><text x="900" y="664.0" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">- Skip anything already</text><text x="900" y="678.5999999999999" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="400" fill="#57534E" text-anchor="start">  covered.</text></svg>
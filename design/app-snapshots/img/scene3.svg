<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Lumina ambient answers — the floating bar"><defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#150E22" flood-opacity="0.42"/>
  </filter>
  <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#3A2F52"/><stop offset="0.55" stop-color="#241D33"/><stop offset="1" stop-color="#161120"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
</defs><rect x="0" y="0" width="1200" height="740" rx="0" fill="url(#wall)"/><rect x="120" y="90" width="420" height="250" rx="12" fill="#FFFFFF" opacity="0.05"/><rect x="600" y="130" width="460" height="180" rx="12" fill="#FFFFFF" opacity="0.04"/><text x="600.0" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9AEd0" text-anchor="middle">⌥  Option + Space  —  from anywhere</text><g filter="url(#sh)"><rect x="320.0" y="300" width="560" height="330" rx="18" fill="#FFFFFF"/></g><rect x="404.0" y="300" width="392.0" height="1.5" rx="1" fill="url(#glow)"/><rect x="601.7" y="326" width="256.29999999999995" height="34" rx="15" fill="url(#pill)"/><text x="729.85" y="347" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">what&#x27;s going on with Angel One?</text><rect x="342.0" y="374" width="470" height="152" rx="14" fill="#F6F4FC"/><text x="360.0" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3F3A47" text-anchor="start">Latency is the live issue.</text><text x="360.0" y="438" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3F3A47" text-anchor="start">Raised again in Monday&#x27;s QBR — third time</text><text x="360.0" y="457" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3F3A47" text-anchor="start">since June. No owner assigned yet.</text><text x="360.0" y="495" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3F3A47" text-anchor="start">Renewal is 12 Sept; Rahul asked you to</text><text x="360.0" y="514" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3F3A47" text-anchor="start">confirm the date this week.</text><rect x="344.0" y="534" width="114.0" height="18" rx="9" fill="#7C3AED" opacity="0.08"/><text x="401.0" y="546.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#6D28D9" text-anchor="middle" opacity="0.85">search_messages</text><rect x="465.0" y="534" width="88.4" height="18" rx="9" fill="#7C3AED" opacity="0.08"/><text x="509.2" y="546.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#6D28D9" text-anchor="middle" opacity="0.85">read_thread</text><rect x="560.4" y="534" width="114.0" height="18" rx="9" fill="#7C3AED" opacity="0.08"/><text x="617.4" y="546.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#6D28D9" text-anchor="middle" opacity="0.85">meetings_search</text><line x1="320.0" y1="564" x2="880.0" y2="564" stroke="#00000010"/><text x="342.0" y="585" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">⤢  Open App</text><text x="858.0" y="585" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="end">Clear</text><line x1="320.0" y1="598" x2="880.0" y2="598" stroke="#00000008"/><text x="342.0" y="620" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#B4AEBD" text-anchor="start">Ask Lumina anything...</text><rect x="828.0" y="606" width="28" height="28" rx="8" fill="#7C3AED"/><path d="M838.0,620 h9 m-4,-4 l4,4 l-4,4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600.0" y="672" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8C82A3" text-anchor="middle">when idle it collapses to this</text><rect x="510.0" y="690" width="180" height="6" rx="3" fill="url(#glow)"/></svg>